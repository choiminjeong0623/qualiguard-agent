# Mosquitto 설정 — 장비 인증 + 토픽별 접근 권한 (N-07, N-08, ADR-015)
# 계정 없는 접속은 거부한다. 계정 파일(passwd)은 scripts/mqtt_users.sh 가 .env 의 비밀번호로 만들며 커밋하지 않는다.
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
