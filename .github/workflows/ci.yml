# CI: 인프라(Docker·SQL Server·Kafka)와 Gemini 키 없이 도는 테스트만 실행한다.
# 인프라가 필요한 테스트는 @Tag("integration") 으로 표시하고, CI 환경(CI=true)에서는 제외한다.
# Docker 만 있으면 되는 시험(@Tag("container"), Testcontainers)은 container 작업에서 따로 돈다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # 테스트 이름이 한글이라, 테스트 보고서 파일명을 쓰려면 UTF-8 로캘이 필요하다
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  qms-app:
    name: qms-app (Java 21 단위 테스트)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qms-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: 단위 테스트
        run: ./gradlew test --no-daemon
      - name: 정적 분석 (SpotBugs, 제외 목록은 config/spotbugs-exclude.xml)
        run: ./gradlew spotbugsMain --no-daemon
      - name: 테스트·정적 분석 결과 보관
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qms-app-test-results
          path: |
            qms-app/build/reports/tests/test
            qms-app/build/reports/spotbugs

  container:
    # 로드맵 Q3: 실제 SQL Server 2025 컨테이너에 DB 초기화 스크립트를 전부 적용하고 승인 프로시저·아웃박스를 확인
    name: qms-app (SQL Server 컨테이너 통합 시험)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qms-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: 컨테이너 통합 시험
        run: ./gradlew containerTest --no-daemon
      - name: 테스트 결과 보관
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qms-app-container-test-results
          path: qms-app/build/reports/tests/containerTest

  simulator:
    name: simulator (Python 3.12 pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: pytest
        run: uv run --with pytest pytest -q tests
