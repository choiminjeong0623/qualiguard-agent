<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 · QualiGuard QMS</title>
<link rel="stylesheet" href="vendor/tabler/tabler.min.css?v=1.4.0">
<link rel="stylesheet" href="qg-tokens.css?v=4">
<link rel="stylesheet" href="qms.css?v=9">
<link rel="stylesheet" href="qg-mobile.css?v=1">
</head>
<body class="qg-login">
<header class="qg-shell">
  <span class="qg-brand"><span class="qg-logo" aria-hidden="true">QG</span>QualiGuard <span class="qg-brand-sub">QMS</span></span>
</header>
<main class="qg-login-main">
  <div class="card qg-login-card">
    <div class="card-body">
      <h1 class="qg-h1 mb-1">로그인</h1>
      <p class="qg-lead mb-4">품질 관리 시스템 · 부적합 검토와 에이전트 조치</p>
      <div id="login-msg" class="msg" role="status"></div>
      <form id="login-form" method="post" action="/login" autocomplete="on">
        <div class="mb-3"><label class="form-label">아이디 <input name="username" class="form-control" autocomplete="username" required autofocus></label></div>
        <div class="mb-3"><label class="form-label">비밀번호 <input name="password" type="password" class="form-control" autocomplete="current-password" required></label></div>
        <input type="hidden" name="_csrf" id="csrf">
        <button type="submit" class="btn btn-primary qg-btn-lg w-100">로그인</button>
      </form>
    </div>
    <div class="card-footer qg-help">계정 문의: 시스템 담당자</div>
  </div>
</main>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var m = document.getElementById('login-msg');
    if (q.has('error')) { m.textContent = '아이디 또는 비밀번호가 맞지 않습니다.'; m.className = 'msg qg-alert'; m.setAttribute('data-tone', 'danger'); }
    if (q.has('logout')) { m.textContent = '로그아웃했습니다.'; m.className = 'msg qg-alert'; m.setAttribute('data-tone', 'success'); }
    // 로그인 요청에도 CSRF 토큰이 필요하다: 서버가 내려준 XSRF-TOKEN 쿠키 값을 폼에 넣는다
    document.getElementById('login-form').addEventListener('submit', function () {
      var c = document.cookie.split('; ').find(function (x) { return x.indexOf('XSRF-TOKEN=') === 0; });
      document.getElementById('csrf').value = c ? decodeURIComponent(c.split('=')[1]) : '';
    });
  }());
</script>
</body>
</html>
