<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QMS 에이전트 조치</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css">
<link rel="stylesheet" href="qms.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>
<header class="qg-shell">
  <a class="qg-brand" href="index.html"><span class="qg-logo" aria-hidden="true">QG</span>QualiGuard <span class="qg-brand-sub">QMS</span></a>
  <a class="qg-shell-title" href="index.html">부적합 검토</a>
  <span class="qg-shell-title">에이전트 조치</span>
  <a class="qg-shell-title" href="shipment.html">출하 시리얼</a>
  <span class="qg-shell-spacer"></span>
  <span class="qg-shell-item"><span id="me"></span></span>
</header>

<div class="page-wrapper qg-page">
  <div class="qg-page-head">
    <div>
      <div class="qg-eyebrow">품질 관리 · 에이전트 조치</div>
      <h1 class="qg-h1">자동 처리, 승인 대기, 효과 검증</h1>
      <p class="qg-lead">저위험 조치는 에이전트가 바로 실행하고, 고위험 조치만 승인을 기다립니다. 실행한 조치는 40 shot 뒤 효과를 확인합니다.</p>
    </div>
    <div class="qg-tiles" id="tiles" role="tablist" aria-label="상태별 조치">
      <button class="qg-tile tab active" data-filter=""><span class="qg-tile-label">전체</span><span class="qg-tile-num" data-count="">–</span></button>
      <button class="qg-tile tab" data-filter="AUTO"><span class="qg-tile-label">자동 처리</span><span class="qg-tile-num" data-count="AUTO">–</span></button>
      <button class="qg-tile tab" data-filter="WAITING_APPROVAL"><span class="qg-tile-label">승인 대기</span><span class="qg-tile-num" data-count="WAITING_APPROVAL">–</span></button>
      <button class="qg-tile tab" data-filter="RESOLVED"><span class="qg-tile-label">효과 확인</span><span class="qg-tile-num" data-count="RESOLVED">–</span></button>
      <button class="qg-tile tab" data-filter="ESCALATED"><span class="qg-tile-label">사람 확인 필요</span><span class="qg-tile-num" data-count="ESCALATED">–</span></button>
    </div>
  </div>

  <div class="card">
    <div class="table-responsive">
      <table class="table table-vcenter card-table qg-table">
        <thead><tr><th>#</th><th>설비</th><th>원인 → 조치</th><th>위험도</th><th>처리</th><th>상태</th><th>근거·효과</th><th></th></tr></thead>
        <tbody id="rows"><tr><td colspan="8" class="text-secondary">불러오는 중…</td></tr></tbody>
      </table>
    </div>
    <div class="card-footer"><p id="msg" class="msg mb-0" role="status"></p></div>
  </div>
</div>

<script src="actions.js"></script>
</body>
</html>
