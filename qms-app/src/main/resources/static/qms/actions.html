<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>조치·판단 보류 · QualiGuard QMS</title>
<link rel="stylesheet" href="vendor/tabler/tabler.min.css?v=1.4.0">
<link rel="stylesheet" href="qg-tokens.css?v=3">
<link rel="stylesheet" href="qms.css?v=7">
<script src="vendor/jquery/jquery.min.js?v=3.7.1"></script>
</head>
<body>
<!-- 공통 셸: 상단 바와 사이드 메뉴는 qg-common.js 가 그린다 -->
<header class="qg-shell" data-active="actions"></header>
<div class="qg-app">
<nav class="qg-side" id="qg-side"></nav>
<div class="qg-side-scrim" id="qg-side-scrim" aria-hidden="true"></div>
<main class="qg-main">

<section class="qg-view" aria-labelledby="page-h1">
  <div class="qg-titlebar">
    <div>
      <h1 class="qg-h1" id="page-h1">조치·판단 보류</h1>
      <p class="qg-lead">저위험 조치는 에이전트가 바로 실행하고, 고위험 조치만 승인을 기다립니다. 실행한 조치는 40 shot 뒤 효과를 확인합니다.</p>
    </div>
  </div>

  <div class="qg-tabs qg-tabs-inline" role="tablist" aria-label="조치·판단 보류" id="page-tabs">
    <button type="button" role="tab" id="tab-actions" aria-controls="p-actions" aria-selected="true">에이전트 조치 <span class="qg-tab-count" id="action-count"></span></button>
    <button type="button" role="tab" id="tab-holds" aria-controls="p-holds" aria-selected="false">판단 보류 <span class="qg-tab-count" id="hold-count"></span></button>
  </div>
  <p id="msg" class="msg qg-page-msg" role="status"></p>

  <!-- ① 에이전트 조치: 상태 거르개 + 표 -->
  <div class="qg-tabpanel qg-tabpanel-flat" role="tabpanel" id="p-actions" aria-labelledby="tab-actions">
    <div class="qg-panel">
      <div class="qg-toolbar">
        <div class="qg-seg" id="tiles" role="group" aria-label="상태로 거르기">
          <button type="button" class="tab active" aria-pressed="true" data-filter="">전체 <span data-count="">–</span></button>
          <button type="button" class="tab" aria-pressed="false" data-filter="WAITING_APPROVAL">승인 대기 <span data-count="WAITING_APPROVAL">–</span></button>
          <button type="button" class="tab" aria-pressed="false" data-filter="ESCALATED">사람 확인 필요 <span data-count="ESCALATED">–</span></button>
          <button type="button" class="tab" aria-pressed="false" data-filter="AUTO">자동 처리 <span data-count="AUTO">–</span></button>
          <button type="button" class="tab" aria-pressed="false" data-filter="RESOLVED">해소 <span data-count="RESOLVED">–</span></button>
        </div>
        <span class="qg-toolbar-spacer"></span>
        <span class="qg-count" id="refresh-note">10초마다 새로 읽음</span>
      </div>
      <div class="table-responsive qg-table-wrap">
        <table class="table table-vcenter card-table qg-table qg-table-list">
          <caption class="visually-hidden">에이전트 조치 목록</caption>
          <thead><tr>
            <th scope="col">상태</th><th scope="col">위험도</th><th scope="col">설비</th><th scope="col">원인 → 조치</th>
            <th scope="col">처리</th><th scope="col">근거·효과</th><th scope="col" class="text-end">번호</th><th scope="col"><span class="visually-hidden">동작</span></th>
          </tr></thead>
          <tbody id="rows"><tr><td colspan="8" class="qg-empty-cell">불러오는 중…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ② 판단 보류: 사람이 확인하고 메모를 남긴다 -->
  <div class="qg-tabpanel qg-tabpanel-flat" role="tabpanel" id="p-holds" aria-labelledby="tab-holds" hidden>
    <div class="qg-panel">
      <div class="qg-toolbar">
        <span class="qg-help">재확인을 상한까지 해도 원인을 정하지 못했거나, 검증 지적이 남은 채 경보가 닫힌 분석입니다. 확인한 내용을 메모로 남겨 주세요.</span>
      </div>
      <div class="table-responsive">
        <table class="table card-table qg-table qg-table-holds">
          <caption class="visually-hidden">판단 보류 목록</caption>
          <thead><tr><th scope="col">보류 사유</th><th scope="col">설비</th><th scope="col">분석</th><th scope="col">에이전트 판단</th>
            <th scope="col">요약 · 확인할 항목</th><th scope="col">검토</th></tr></thead>
          <tbody id="hold-rows"><tr><td colspan="6" class="qg-empty-cell">불러오는 중…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</section>

</main>
</div>

<script src="qg-common.js?v=5"></script>
<script src="actions.js?v=4"></script>
</body>
</html>
