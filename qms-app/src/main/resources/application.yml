spring:
  application:
    name: qms-app
  config:
    import: optional:file:../.env[.properties]   # 프로젝트 루트 .env 의 MSSQL_SA_PASSWORD 를 그대로 사용
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=QUALIGUARD;encrypt=true;trustServerCertificate=true
    # 앱 전용 계정 (로드맵 Q5): .env 에 QG_DB_USERNAME·QG_DB_PASSWORD 가 있으면 그 계정(읽기·쓰기·프로시저 실행만)으로,
    # 없으면 예전처럼 sa 로 접속한다. 계정은 mssql-init 이 같은 값으로 infra/mssql/init/app_login.sqlcmd 를 실행해 만든다
    username: ${QG_DB_USERNAME:sa}
    password: ${QG_DB_PASSWORD:${MSSQL_SA_PASSWORD}}
    hikari:
      maximum-pool-size: 5                     # 8GB 환경: 연결 수 최소화
  ai:
    mcp:
      server:
        name: qualiguard-qms
        version: 1.0.0
        protocol: streamable                  # POST /mcp (streamable HTTP)
        instructions: >-
          사출성형 라인 QMS 조회 도구입니다. 기준 경보(anomalyId)를 주면 그 경보 시각까지의 데이터만 조회합니다.
          지난 경보를 분석할 때는 반드시 기준 경보를 지정해 미래 데이터를 보지 않게 하세요.
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}             # 루트 .env 에서 읽음
        embedding:
          api-key: ${GEMINI_API_KEY:}           # 유사 사례 의미 검색용 임베딩 (ADR-014)
          text:
            options:
              model: gemini-embedding-001
              dimensions: 768
              task-type: SEMANTIC_SIMILARITY
        chat:
          model: ${GEMINI_MODEL:gemini-3.8-flash}
          temperature: 0.2                      # 분석 결과가 매번 크게 달라지지 않도록 낮게
          include-thoughts: true                # Gemini 3 계열: 도구 호출 반복 시 사고 서명 필요 (Spring AI 문서)
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all                       # 리더와 복제본 모두 기록해야 성공으로 본다
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true      # 재시도 중 같은 메시지가 두 번 기록되지 않게 한다
        linger.ms: 5
    consumer:
      group-id: qg-db-writer                    # DB 적재용 소비자 그룹
      auto-offset-reset: earliest               # 처음 실행 시 토픽의 처음부터 적재
      isolation-level: read_committed           # Kafka Streams 트랜잭션이 커밋된 메시지만 읽음
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    streams:
      application-id: qg-quality-pipeline     # 소비자 그룹·내부 토픽 이름의 기준
      state-dir: ./build/kafka-streams-state  # 설비별 SPC 상태(RocksDB) 저장 위치
      properties:
        default.key.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
        default.value.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
        processing.guarantee: exactly_once_v2  # 상태 갱신과 결과 기록을 하나의 트랜잭션으로 묶음
        commit.interval.ms: 1000

  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true                      # QMS 화면(정적 파일)을 고친 뒤 브라우저가 예전 JS 를 쓰지 않게 (매번 확인)

server:
  port: 8080

qg:
  security:
    api-token: ${QG_AGENT_API_TOKEN:}   # /api/agent·/mcp·/actuator 용 토큰 (루트 .env). 비어 있으면 토큰 인증 꺼짐 (Q2)
  mqtt:
    url: ${QG_MQTT_URL:tcp://localhost:1883}   # TLS: ssl://localhost:8883 (scripts/mqtt_tls.sh, 로드맵 Q5)
    client-id: qg-bridge              # 고정 ID + 지속 세션 → 브리지가 꺼진 동안의 메시지를 브로커가 보관
    topics:
      - factory/+/+/telemetry         # + 는 한 단계 와일드카드 (라인, 설비)
    qos: 1
    session-expiry-seconds: 3600
    username: ${MQTT_BRIDGE_USERNAME:qg-bridge}   # 브로커 계정 (N-07). ACL 상 telemetry 읽기만 가능
    password: ${MQTT_BRIDGE_PASSWORD:}           # 루트 .env (scripts/mqtt_users.sh 가 생성)
    ca-file: ${MQTT_TLS_CA:}                      # TLS 일 때 믿을 CA 인증서 (저장소 루트 기준 경로, 예: infra/mosquitto/certs/ca.crt)
  bridge:
    dedup-cache-size: 100000          # 최근 messageId 보관 개수 (중복 수신 거르기)
    kafka-send-timeout-seconds: 5

  agent:
    auto-enabled: false               # true 면 새 경보를 자동 분석 (LLM 비용 발생). 시험은 API 로 수동 실행
    poll-ms: 5000
    incident-shot-window: 100         # 첫 경보부터 100 shot 안의 경보를 한 사건으로 묶음
    incident-minutes: 30
    merge-minutes: 60                 # 같은 설비·같은 원인 초안이 60분 안에 있으면 그 초안에 연결
    recheck-shots: 40                 # 관찰(OBSERVE) 판단 뒤 새 경보가 없어도 40 shot 이 지나면 다시 분석
    recheck-max: 3                    # 새 경보 없이 이어지는 재확인 최대 횟수 (LLM 비용 상한)
    analysis-mode: tools              # 분석 방식 (로드맵 A1): tools(모델이 도구를 골라 부름) / prefetch(도구 1~5를 정해진 인자로 미리 조회 + LLM 1회, 비교용)
    verify-max-retries: 1             # 검증 에이전트가 근거 부족으로 되돌리면 다시 분석하는 최대 횟수 (ADR-016)
    llm:                              # LLM 호출 보호 (로드맵 O4, LlmCallPolicy)
      timeout: 90s                    # 호출 1회(도구 조사 포함) 시간 제한
      max-retries: 1                  # 시간 초과·5xx·429·네트워크 오류일 때만 재시도. 키 오류(401·403)는 바로 실패
      backoff: 2s                     # 첫 재시도 전 대기, 이후 2배씩
    budget:                           # 하루 토큰 예산 (로드맵 O5, TokenBudget)
      daily-tokens: 1000000           # 오늘(0시부터) 입력+출력+생각 토큰 합이 넘으면 자동 분석 중지. 수동 분석은 가능. 0 이면 끔
      zone: Asia/Seoul
    ml-triage:                        # ML 먼저, 애매하면 LLM (실험 기능, eval/ml_cascade_report.md)
      mode: "off"                     # off(기본) / shadow(ML 판단을 기록만, LLM 그대로) / skip(학습한 고장 원인을 threshold 이상이면 LLM 생략)
      threshold: 0.9                  # skip 기준 확률. 단발성(NOISE)은 확률과 관계없이 LLM 으로 넘긴다
      model: classpath:ml/cause-forest.json   # scripts/ml_cascade.sh 가 만든 모델 (시뮬레이터 학습)
      novelty-check: true             # 고른 원인의 학습 경보들과 많이 다른 '낯선 경보'는 확률이 높아도 LLM 으로 (eval/ml_novel_report.md)
      audit-rate: 0.1                 # skip 모드: 건너뛸 수 있는 사건 중 이 비율은 LLM 이 분석해 ML 답과 비교 기록 (GET /api/agent/ml-triage/stats)
    pipeline:
      transport: kafka                # 에이전트 사이 전달: kafka(agent.incident.* 토픽) / direct(같은 스레드, Kafka 없이 시험)
      wait-seconds: 600               # API 가 사건 결과를 기다리는 최대 시간 (넘어도 파이프라인은 계속 진행)
    action:
      enabled: false                  # true 면 분석 뒤 조치 에이전트가 위험도에 따라 자동 실행·승인 대기를 정함 (가상 실행)
      max-auto-per-day: 3             # 설비별 24시간 자동 실행 한도 (넘으면 사람 승인)
      check-shots: 40                 # 실행 뒤 이 shot 수가 쌓이면 조치 전후를 비교해 효과 판정
      max-attempts: 2                 # 효과 없을 때 다른 원인으로 다시 해 보는 최대 조치 수 (넘으면 사람에게)
      poll-ms: 5000
    writer:
      mode: analysis-text             # 초안 문장: analysis-text(분석 문장 그대로) / local(Ollama) / template(근거 표만)
      ollama-url: http://localhost:11434
      model: qwen2.5:1.5b             # 로컬 소형 모델 (M1 8GB: 4bit 1.5B, docs/03)
      timeout-seconds: 120            # 넘으면 클라우드로 넘기지 않고 근거 표 초안으로 (F-13)
  quality:
    mewma:
      # 다변량 이상 탐지(MEWMA). off / shadow (로그·지표 qg.spc.mewma_shadow_alarms 만, 경보는 지금 SPC 규칙 그대로)
      mode: "off"
      lambda: 0.2
      limit: 35.26
  knowledge:
    vector-enabled: true              # 유사 사례 의미 검색 (SQL Server VECTOR, ADR-014). 끄면 키워드 검색만
    refresh-ms: 60000                 # 지식저장소 사례 벡터를 새로 만들 주기
  integration:
    publish-enabled: true             # 승인 이벤트 아웃박스를 Kafka(quality.ncr.approved)로 발행
    poll-ms: 2000
    receiver-enabled: true            # 가상 MES/ERP 수신 서비스 (별도 소비자 그룹)
    ack-enabled: true                 # QMS 쪽 MES/ERP 응답(integration.ncr.ack) 수신
    simulate-failure: ""              # 시험용: "ERP" 처럼 지정한 시스템은 실패 응답을 보냄

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

logging:
  level:
    com.qualiguard: INFO
