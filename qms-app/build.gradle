plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.github.spotbugs' version '6.5.1'   // 정적 분석 (로드맵 Q4)
}

group = 'com.qualiguard'
version = '0.0.1-SNAPSHOT'
description = 'QualiGuard QMS'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.integration:spring-integration-mqtt'
	implementation 'org.eclipse.paho:org.eclipse.paho.mqttv5.client:1.2.5'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-integration'
	implementation 'org.springframework.boot:spring-boot-starter-kafka'
	implementation 'org.apache.kafka:kafka-streams'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	runtimeOnly 'com.microsoft.sqlserver:mssql-jdbc'
	implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'
	implementation 'org.springframework.ai:spring-ai-starter-model-google-genai-embedding'
	implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.integration:spring-integration-http'
	implementation 'org.springframework.integration:spring-integration-kafka'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-kafka-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.integration:spring-integration-test'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'   // 컨테이너 통합 시험 (로드맵 Q3)
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform {
		// CI 에는 SQL Server·Kafka·Gemini 키가 없으므로 통합 시험(@Tag("integration"))을 뺀다
		if (System.getenv('CI') == 'true') {
			excludeTags 'integration'
		}
		// Docker 컨테이너를 띄우는 시험은 containerTest 로 따로 돌린다 (로드맵 Q3)
		excludeTags 'container'
	}
}

// 컨테이너 통합 시험 (로드맵 Q3): 실제 SQL Server 2025 컨테이너에 init 스크립트 전부 적용 → 승인 프로시저·아웃박스 확인
tasks.register('containerTest', Test) {
	group = 'verification'
	description = 'Docker 로 SQL Server 를 띄워 DB 초기화 스크립트와 승인 프로시저를 확인한다'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	inputs.dir('../infra/mssql/init')   // 스크립트가 바뀌면 다시 돈다 (Gradle 이 '변화 없음' 으로 건너뛰지 않게)
	useJUnitPlatform {
		includeTags 'container'
	}
}

// 8GB RAM 환경: 개발 중 bootRun의 힙을 384MB로 제한
tasks.named('bootRun') {
	jvmArgs = ['-Xms128m', '-Xmx384m']
}

// Spring AI 버전 관리 (Spring Boot 4 기반 2.0 계열)
dependencyManagement {
	imports {
		mavenBom 'org.springframework.ai:spring-ai-bom:2.0.2'
	}
}

// 공개 실제 데이터(UCI SECOM) 보조 검증: ./scripts/fetch_secom.sh 로 data/secom 을 받은 뒤 실행
tasks.register('secomValidation', JavaExec) {
	group = 'verification'
	description = 'UCI SECOM 에 같은 SPC 엔진을 적용해 결과를 data/secom/secom_report.md 에 남긴다'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.qualiguard.qms.quality.SecomValidation'
	args = ['../data/secom']
	jvmArgs = ['-Xmx384m']
}
tasks.register('secomT2', JavaExec) {
	group = 'verification'
	description = 'UCI SECOM 에 PCA 기반 Hotelling T²·SPE 를 적용해 data/secom/secom_t2_report.md 에 남긴다 (로드맵 A4)'
	dependsOn 'testClasses'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.qualiguard.qms.quality.SecomT2'
	args = ['../data/secom']
	jvmArgs = ['-Xmx512m']
}

// 이상 탐지 평가 (로드맵 E2): 시뮬레이터로 seed 5개 파일을 만들고 같은 SPC 엔진으로 재생해 채점한다
tasks.register('detectionData', Exec) {
	group = 'verification'
	description = '시뮬레이터 파일 출력으로 eval/detection/runs/seed-1..5 를 만든다'
	workingDir = rootDir
	commandLine 'bash', '../scripts/detection_data.sh', '5'
}

tasks.register('detectionEval', JavaExec) {
	group = 'verification'
	description = '탐지 P/R/F1·FPR·FNR·탐지 지연을 eval/detection_report.md 에 남긴다'
	dependsOn 'detectionData', 'testClasses'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.qualiguard.qms.quality.DetectionEval'
	args = ['../eval/detection/runs', '../eval/detection_report.md']
	jvmArgs = ['-Xmx384m']
}

tasks.register('ewmaEval', JavaExec) {
	group = 'verification'
	description = '지금 SPC 규칙과 EWMA 관리도를 같은 seed 로 비교해 eval/ewma_report.md 에 남긴다 (로드맵 A4)'
	dependsOn 'detectionData', 'testClasses'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.qualiguard.qms.quality.EwmaEval'
	args = ['../eval/detection/runs', '../eval/ewma_report.md']
	jvmArgs = ['-Xmx384m']
}

// 정적 분석 (로드맵 Q4): 운영 코드만 검사, 중간 이상 심각도에서 실패. 제외 규칙과 이유는 config/spotbugs-exclude.xml
spotbugs {
	ignoreFailures = false
	reportLevel = com.github.spotbugs.snom.Confidence.valueOf('MEDIUM')
	excludeFilter = file('config/spotbugs-exclude.xml')
}
tasks.named('spotbugsTest') {
	enabled = false
}
tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
	reports {
		html { required = true }
		xml { required = true }
	}
}
