[project]
name = "qg-simulator"
version = "0.1.0"
description = "QualiGuard — 사출성형 라인 센서 시뮬레이터 (MQTT 발행)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "paho-mqtt>=2.1",
    "pyyaml>=6.0",
]

[project.scripts]
qg-simulator = "qg_simulator.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qg_simulator"]
